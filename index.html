<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YardMaid</title>
<meta name="theme-color" content="#2C5E38">
<meta name="description" content="Book eco-friendly yard care and home cleaning in San Diego.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YardMaid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one app shell. Phone frame on wide screens, full-bleed on phones.
   Role switcher on top swaps Guest, Business and New-business views over one shared data set. */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface-2:#EFE9DB; --line:#E2DBC9;
  --text:#22301F; --soft:#5A6652;
  --brand:#34A853; --brand-light:#5BC86A; --brand-deep:#2C5E38;
  --accent:#2C5E38; --on-accent:#FFFFFF;
  --btn-a:#2A8A45; --btn-b:#21653A;
  --tint:#E3F2DB; --tint-text:#2C5E38;
  --warn-bg:#FBF0D5; --warn:#7A4E00;
  --bad-bg:#F8E1DA; --bad:#A33B1E;
  --info-bg:#E4ECF4; --info:#2F4F73;
  --star:#D69E1F; --bezel:#17241A;
  --shadow:0 30px 60px -26px rgba(30,51,36,.4);
  --f-display:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1711; --surface:#17211A; --surface-2:#212E25; --line:#2C3B30;
    --text:#E6EEE2; --soft:#9DAF98;
    --accent:#7ED18B; --on-accent:#0F2214;
    --tint:#1F3A27; --tint-text:#8FDB9B;
    --warn-bg:#3A2F12; --warn:#F0C766;
    --bad-bg:#3B1E17; --bad:#F0A08A;
    --info-bg:#1E2D3D; --info:#9CC3EA;
    --star:#E3B03B; --bezel:#27382B;
    --shadow:0 30px 60px -26px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1711; --surface:#17211A; --surface-2:#212E25; --line:#2C3B30;
  --text:#E6EEE2; --soft:#9DAF98;
  --accent:#7ED18B; --on-accent:#0F2214;
  --tint:#1F3A27; --tint-text:#8FDB9B;
  --warn-bg:#3A2F12; --warn:#F0C766;
  --bad-bg:#3B1E17; --bad:#F0A08A;
  --info-bg:#1E2D3D; --info:#9CC3EA;
  --star:#E3B03B; --bezel:#27382B;
  --shadow:0 30px 60px -26px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top: brand + role switcher */
.top{display:flex;align-items:center;justify-content:center;gap:12px 18px;flex-wrap:wrap;flex:none}
.lockup{display:flex;align-items:center;gap:8px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand-light),var(--brand));display:flex;align-items:center;justify-content:center}
.mark svg{width:18px;height:18px}
.word{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--accent);letter-spacing:-.02em}
.switcher{display:flex;flex-wrap:wrap;justify-content:center;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px}
.switcher button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:700;font-size:12.5px;color:var(--soft)}
.switcher button.on{background:var(--accent);color:var(--on-accent)}
.note{display:none;max-width:380px;text-align:center;color:var(--soft);font-size:12px}

/* app shell */
.phone{position:relative;flex:1;min-height:0;width:100%;max-width:420px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.notch{display:none;position:absolute;top:0;left:50%;transform:translateX(-50%);width:116px;height:22px;background:var(--bezel);border-radius:0 0 14px 14px;z-index:5}
.screen{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
.screen.enter{animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px) * 0);border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px}
.tab{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--soft);font-size:10.5px;font-weight:700}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--accent)}
.badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:var(--bad-bg);font-style:normal;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.toast{position:absolute;left:16px;right:16px;bottom:76px;z-index:20;background:var(--text);color:var(--bg);padding:11px 14px;border-radius:12px;font-weight:700;font-size:13px;text-align:center}
@media (min-width:700px){
  .phone{flex:none;height:800px;border:10px solid var(--bezel);border-radius:46px;box-shadow:var(--shadow)}
  .notch{display:block}
  .screen{padding-top:34px}
  .note{display:block}
}

/* type + small parts */
.muted{color:var(--soft)}
.m0{margin:0}
.big{font-size:16px;font-family:var(--f-display);font-weight:800}
.hi{font-size:24px;font-weight:800;margin-bottom:2px}
.lead{margin-bottom:14px}
.page-t{font-size:22px;font-weight:800;margin:2px 0 14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}
.sec h3{font-size:15px}
.sec span{font-size:12px;color:var(--soft);font-weight:700}
.center{text-align:center}
.hint{font-size:12px;margin-top:8px}
.amt{font-weight:800;color:var(--accent);font-family:var(--f-display);white-space:nowrap}
.star{color:var(--star)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.bar-t{font-size:15px;font-weight:800;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-sp{width:34px;flex:none}
.back{width:34px;height:34px;flex:none;border-radius:10px;border:0;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center}
.back svg{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:700;font-size:14.5px;width:100%}
.btn svg{width:17px;height:17px}
.btn.primary{background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff}
.btn.soft{background:var(--surface-2);color:var(--accent);border-color:var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.sm{min-height:38px;font-size:13px;border-radius:11px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pair{display:flex;gap:8px}
.pair .btn{flex:1}

.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.tinted{background:var(--tint);border-color:transparent}
.card.warnc{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.row-card{display:flex;gap:12px;align-items:flex-start;font-family:inherit}
.row-card .grow{min-width:0}
.grow{flex:1;min-width:0}
.rc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.head{display:flex;gap:12px;align-items:center}
.avatar svg{width:22px;height:22px}
.avatar{width:46px;height:46px;border-radius:14px;flex:none;background:linear-gradient(135deg,var(--brand-light),var(--brand));color:#0F2A16;font-family:var(--f-display);font-weight:800;display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-left:0}
.rate .pill{margin-left:8px}
.pill.ok{background:var(--tint);color:var(--tint-text)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--soft)}
.pill.info{background:var(--info-bg);color:var(--info)}
.rate{margin-top:4px;font-size:12.5px}

.rows{padding-block:6px}
.r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r span:first-child{color:var(--soft);flex:none}
.r span:last-child{text-align:right;font-weight:700;min-width:0;overflow-wrap:anywhere}

.search{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:11px 13px;margin-bottom:12px;color:var(--soft)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-weight:700;color:var(--soft)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.hero{border-radius:20px;padding:18px;min-height:112px;display:flex;align-items:flex-end;background:linear-gradient(135deg,#2F9C4E,#2C5E38);color:#fff;margin-bottom:12px}
.hero b{font-family:var(--f-display);font-size:21px;display:block}
.hero span{opacity:.92;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:16px;color:var(--accent)}
.stat span{font-size:11px;color:var(--soft)}
.svcline{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.svcline:last-child{border-bottom:0}
.review{padding:12px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
.review .rh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
.reply{margin-top:8px;padding:9px 11px;border-radius:12px;background:var(--surface-2);font-size:13px}

.field{margin-bottom:14px}
.field>label,.lab{display:block;font-size:12px;font-weight:800;color:var(--soft);margin-bottom:6px}
.field input,.field select,.field textarea,.price input{width:100%;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.field textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;text-align:center;min-width:0}
.day small{display:block;font-size:10px;color:var(--soft);font-weight:700}
.day b{font-family:var(--f-display);font-size:15px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on small{color:inherit;opacity:.8}
.day i{display:block;width:5px;height:5px;border-radius:50%;background:var(--brand);margin:3px auto 0}
.day.on i{background:var(--on-accent)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 4px;font-weight:700;font-size:12.5px}
.slot.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.opt.on{background:var(--tint);border-color:var(--accent)}
.opt b{display:block}
.opt span.s{display:block;font-size:12.5px;color:var(--soft)}
.dot,.box{flex:none;width:20px;height:20px;margin-top:1px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.dot{border-radius:50%}
.box{border-radius:6px}
.box svg{width:13px;height:13px;stroke-width:3}
.opt.on .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.opt.on .box,.svc-row.on .box{border-color:var(--accent);background:var(--accent)}
.starrow{display:flex;gap:2px;justify-content:center;margin:6px 0 14px}
.starbtn{background:none;border:0;font-size:36px;line-height:1;color:var(--line);padding:2px 4px}
.starbtn.on{color:var(--star)}
.photo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:12px}

.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.lrow:last-child{border-bottom:0}
.lrow svg{width:16px;height:16px;color:var(--soft);flex:none}
.lrow .grow b{display:block}
.lrow .grow span{font-size:12px;color:var(--soft)}
.tsw{position:relative;flex:none;width:44px;height:26px;border-radius:14px;background:var(--line);border:0;padding:0}
.tsw.on{background:var(--accent)}
.tsw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tsw.on i{left:21px}
.tsw.on i{background:var(--on-accent)}

.empty{text-align:center;color:var(--soft);padding:36px 12px}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.5}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.done-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:34px;gap:6px}
.done-badge{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.done-badge svg{width:32px;height:32px;stroke-width:3}

/* chat */
.ctx{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--surface-2);border:0;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;text-align:left}
.ctx svg{width:14px;height:14px;flex:none;color:var(--soft)}
.demo{font-size:11.5px;color:var(--soft);margin:8px 0 12px;text-align:center}
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;overflow-wrap:anywhere}
.bub small{display:block;font-size:10.5px;opacity:.65;margin-top:2px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.quick{display:flex;gap:6px;overflow-x:auto}
.quick::-webkit-scrollbar{display:none}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:44px}
.send{width:44px;height:44px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--btn-a),var(--btn-b));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.send svg{width:18px;height:18px}
.thread .rc-top small{color:var(--soft);font-weight:600}
.thread .snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* onboarding */
.prog{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-light),var(--brand));transition:width .3s}
.step-l{font-size:12px;margin:8px 0 14px;font-weight:700}
.svc-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.svc-row.on{border-color:var(--accent);background:var(--tint)}
.svc-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:2px 0;font-weight:700}
.price{display:flex;align-items:center;gap:4px;width:92px;flex:none}
.price input{padding:8px 10px}
.uprow{display:flex;align-items:center;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk i{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800}
.chk i.ok{background:var(--accent);color:var(--on-accent)}
.chk i.wait{background:var(--warn-bg);color:var(--warn)}
.chk i svg{width:12px;height:12px;stroke-width:3}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="lockup">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 19c-3.2 0-5-2-5-4.6 0-3 3-5 5-6 2 1 5 3 5 6 0 2.600-1.800 4.600-5 4.600z" fill="#fff"/></svg></span>
    <span class="word">YardMaid</span>
  </div>
  <div class="switcher" role="group" aria-label="Preview as">
    <button id="m-guest" class="on" onclick="setMode('guest')">Guest</button>
    <button id="m-business" onclick="setMode('business')">Provider</button>
    <button id="m-manager" onclick="setMode('manager')">Property manager</button>
    <button id="m-onboard" onclick="setMode('onboard')">New provider</button>
  </div>
</header>

<main class="phone">
  <div class="notch"></div>
  <div class="screen" id="screen"></div>
  <div class="foot" id="foot" hidden></div>
  <nav class="tabbar" id="tabbar" hidden></nav>
  <div class="toast" id="toast" hidden role="status"></div>
</main>
<p class="note">Clickable prototype with sample data. Nothing is booked or charged. Guest, Provider and Property manager share the same bookings, so an action on one side shows up on the others.</p>

<script>
'use strict';
/* ---------- icons ---------- */
const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:ic('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'),

function payText(b){
  const g=S.mode==='guest';
  if(b.status==='requested')return g?'Not charged yet. Payment is taken when the provider accepts.':'Guest is charged when you accept.';
  if(b.status==='confirmed')return g?'Paid. Held until the job is complete.':'Held by YardMaid until the job is complete.';
  if(b.status==='declined')return 'Not charged';
  if(b.status==='cancelled'){
    if(g)return b.noCharge?'Not charged':b.refund>=b.price?'Refunded in full':`Refunded ${money(b.refund)}. ${money(b.price-b.refund)} late fee kept.`;
    if(b.cancelBy==='business')return 'Cancelled by you. No payout.';
    if(b.noCharge)return 'Cancelled before payment.';
    return b.refund<b.price?`Late-cancel fee payout: ${money(Math.round((b.price-b.refund)*85)/100)}`:'Cancelled by guest. No payout.';
  }
  const d=b.dispute;
  if(d&&d.stage!=='resolved')return g?'Paid. On hold during the dispute.':'Payout on hold during the dispute.';
  return b.justDone?(g?'Paid':'Payout scheduled'):(g?'Paid':'Paid out');

}
function offerText(d,b){return d.offer.kind==='redo'?'a free redo visit':`a ${d.offer.pct}% refund (${money(b.price*d.offer.pct/100)})`}
function disputeCard(b){

R.guest.review=c=>{

/* shared: booking detail + changes */
R.shared.booking=c=>{
  const b=bk(c.id),g=S.mode==='guest',who=other(b);
  let h=bar('Booking');
  h+=`<div class="card head"><div class="avatar">${initials(who)}</div><div class="grow"><b class="big">${esc(who)}</b><div class="muted">${esc(b.svc)}</div><div class="pills">${statusPill(b)}</div></div></div>`;
  h+=pendingCard(b);
  h+=`<div class="card rows">${row('When',when(b))}${b.repeat&&b.repeat!=='One time'?row('Repeats',esc(b.repeat)):''}${b.prop?row('Property',esc(b.prop)):''}${row('Where',esc(b.addr))}${g?row('Total',money(b.price)):row('Your payout',`${money(pay(b))} <span class="muted">after 15% commission</span>`)}${row('Payment',payText(b))}${b.note?row('Note',esc(b.note)):''}${b.ref?row('Work order',esc(b.ref)):''}</div>`;
  h+=disputeCard(b)+reviewCard(b);
  let a='';
  if(!g&&b.status==='requested')a+=`<div class="pair"><button class="btn primary" onclick="acceptReq('${b.id}')">Accept</button><button class="btn ghost" onclick="declineReq('${b.id}')">Decline</button></div>`;
  if(!g&&b.status==='confirmed')a+=`<button class="btn primary" onclick="markDone('${b.id}')">${I.check} Mark job complete</button>`;
  a+=`<button class="btn soft" onclick="go('chat',{id:'${b.id}'})">${I.chat} Message ${esc(first(who))}</button>`;
  if(isUp(b)&&!b.pending)a+=`<button class="btn ghost" onclick="openResched('${b.id}')">${g?'Reschedule':'Propose a new time'}</button>`;
  if(isUp(b)&&(g||b.status==='confirmed'))a+=`<button class="btn danger" onclick="openCancel('${b.id}')">${g?'Cancel booking':'Cancel this job'}</button>`;
  if(g&&b.status==='completed'){
    if(!b.review)a+=`<button class="btn primary" onclick="openReview('${b.id}')">Leave a review</button>`;
    if(!b.dispute)a+=`<button class="btn ghost" onclick="openReport('${b.id}')">Report a problem</button>`;
    a+=`<button class="btn soft" onclick="go('provider',{id:${b.pid}})">Book again</button>`;
  }
  if(!g&&b.review&&!b.review.reply)a+=`<button class="btn soft" onclick="S.replying='${b.id}';go('reviews')">Reply to review</button>`;
  return {html:h+`<div class="stack">${a}</div>`};
};

R.shared.resched=c=>{
  const b=bk(c.id),d=S.draft,g=S.mode==='guest',nm=esc(first(other(b)));
  let h=bar(g?'Reschedule':'Propose a new time');
  h+=`<div class="card tinted"><div class="muted">Current time</div><b>${when(b)}</b></div>`+pickers(d);
  h+=`<p class="muted hint">${nm} has to approve the new time. The current time stays booked until then.</p>`;
  const changed=d.dayOff!==b.dayOff||d.time!==b.time;

function openCancel(id){S.draft={id,reason:''};go('cancel',{id})}
function cancelCalc(b){
  const g=S.mode==='guest',ho=hoursOut(b);
  if(!g)return {refund:b.price,msg:'The guest is refunded in full. Cancelling a confirmed job can lower your reliability score and your ranking in search.',noCharge:false};
  if(b.status==='requested')return {refund:0,msg:'You have not been charged, so there is nothing to refund.',noCharge:true};
  if(ho>=24)return {refund:b.price,msg:'Free cancellation. This job is more than 24 hours away.',noCharge:false};
  return {refund:Math.round(b.price*50)/100,msg:'This job starts in less than 24 hours, so a 50% late cancellation fee applies.',noCharge:false};
}
R.shared.cancel=c=>{

  h+=`<div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="${OB_STEPS.length}" aria-valuenow="${i+1}"><i style="width:${(i+1)/OB_STEPS.length*100}%"></i></div><p class="muted step-l">Step ${i+1} of ${OB_STEPS.length} · ${OB_STEPS[i]}</p>`;
  h+=OB_BODY[i]();
  return {html:h,foot:obFootHtml()};
}

paint(false);
</script>
